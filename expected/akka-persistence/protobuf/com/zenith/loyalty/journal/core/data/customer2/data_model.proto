syntax = "proto3";

package com.zenith.loyalty.journal.core.data.customer2.data_model;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "scalapb/scalapb.proto";

option (scalapb.options) = {
  scope: FILE
  package_name: "com.zenith.loyalty.journal.core.data.customer2.data_model"
  flat_package: true
  single_file: true
  java_conversions: false
  import: "infrastructure.journal.*"
  lenses: true
  getters: true
  retain_source_code_info: false
  no_default_values_in_constructor: false
  preserve_unknown_fields: false
  enum_value_naming: CAMEL_CASE
  enum_strip_prefix: false
  scala3_sources: true
};

message OptInData {
  option (scalapb.message).extends = "JournalSerializable";

  google.protobuf.StringValue externalId = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];

  google.protobuf.Timestamp optedInAt = 2;
}
