syntax = "proto3";

package com.zenith.loyalty.journal.core.data.campaign.events;

import "com/zenith/loyalty/journal/core/data/campaign/data_model.proto";
import "google/protobuf/wrappers.proto";
import "scalapb/scalapb.proto";

option (scalapb.options) = {
  scope: FILE
  package_name: "com.zenith.loyalty.journal.core.data.campaign.events"
  flat_package: true
  single_file: true
  java_conversions: false
  import: "infrastructure.journal.*"
  preamble: "sealed trait Event extends JournalSerializable"
  lenses: true
  getters: true
  retain_source_code_info: false
  no_default_values_in_constructor: false
  preserve_unknown_fields: false
  enum_value_naming: CAMEL_CASE
  enum_strip_prefix: false
  scala3_sources: true
};

message CampaignCreated {
  option (scalapb.message).extends = "Event";

  google.protobuf.Int64Value advertiserId = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  string name = 2;
  google.protobuf.StringValue userId = 3 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  com.zenith.loyalty.journal.core.data.campaign.data_model.Budget budget = 4 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  com.zenith.loyalty.journal.core.data.campaign.data_model.Duration duration = 5 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  com.zenith.loyalty.journal.core.data.campaign.data_model.Status status = 6;
  google.protobuf.Int64Value maxNumberOfPayouts = 7 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
}

message CampaignUpdated {
  option (scalapb.message).extends = "Event";

  google.protobuf.StringValue name = 1;
  com.zenith.loyalty.journal.core.data.campaign.data_model.Budget budget = 2;
  com.zenith.loyalty.journal.core.data.campaign.data_model.Duration duration = 3;
  com.zenith.loyalty.journal.core.data.campaign.data_model.StatusOptional status = 4;
  google.protobuf.Int64Value maxNumberOfPayouts = 5;
}

message FlightAdded {
  option (scalapb.message).extends = "Event";

  string flightId = 1;
}
