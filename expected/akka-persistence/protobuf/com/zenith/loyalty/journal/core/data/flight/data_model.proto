syntax = "proto3";

package com.zenith.loyalty.journal.core.data.flight.data_model;

import "com/zenith/loyalty/journal/core/data/campaign/data_model.proto";
import "com/zenith/loyalty/journal/core/data/common/data_model.proto";
import "google/protobuf/wrappers.proto";
import "scalapb/scalapb.proto";

option (scalapb.options) = {
  scope: FILE
  package_name: "com.zenith.loyalty.journal.core.data.flight.data_model"
  flat_package: true
  single_file: true
  java_conversions: false
  import: "infrastructure.journal.*"
  lenses: true
  getters: true
  retain_source_code_info: false
  no_default_values_in_constructor: false
  preserve_unknown_fields: false
  enum_value_naming: CAMEL_CASE
  enum_strip_prefix: false
  scala3_sources: true
};

message Image {
  option (scalapb.message).extends = "JournalSerializable";

  google.protobuf.StringValue imageKey = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
}

message CarouselCard {
  option (scalapb.message).extends = "JournalSerializable";

  Image logo = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  Image banner = 2 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  google.protobuf.StringValue carouselCopy = 3;
  google.protobuf.StringValue disclosure = 4 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  google.protobuf.StringValue trackingPixelUrl = 5;

  google.protobuf.StringValue shopNowCtaUrl = 6;
}

message Interstitial {
  option (scalapb.message).extends = "JournalSerializable";

  google.protobuf.StringValue title = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  google.protobuf.StringValue body = 2 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  Image imageWeb = 3 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  Image imageMobile = 4 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  google.protobuf.StringValue callToActionLabel = 5;
  google.protobuf.StringValue callToActionUrl = 6;
  google.protobuf.StringValue disclosure = 7 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  google.protobuf.StringValue trackingPixelUrl = 8;

  google.protobuf.StringValue shopNowCtaUrl = 9;
}

message Tile {
  option (scalapb.message).extends = "JournalSerializable";

  google.protobuf.StringValue title = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  google.protobuf.StringValue body = 2 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  Image icon = 3 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  google.protobuf.StringValue callToActionLabel = 4;
  google.protobuf.StringValue callToActionUrl = 5;
  google.protobuf.StringValue disclosure = 6;
  google.protobuf.StringValue trackingPixelUrl = 7;

  google.protobuf.StringValue shopNowCtaUrl = 8;
}

message RewardCap {
  option (scalapb.message).extends = "JournalSerializable";

  int64 maxRewardsPerFlight = 1;
  com.zenith.loyalty.journal.core.data.common.data_model.Amount maxAmountPerTransaction = 2 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  com.zenith.loyalty.journal.core.data.common.data_model.Amount maxAmountPerCustomer = 3 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  int64 maxRewardsPerCustomer = 4;
}

