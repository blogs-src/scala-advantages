syntax = "proto3";

package com.zenith.loyalty.journal.core.data.campaign.data_model;

import "com/zenith/loyalty/journal/core/data/common/data_model.proto";
import "google/protobuf/timestamp.proto";
import "scalapb/scalapb.proto";

option (scalapb.options) = {
  scope: FILE
  package_name: "com.zenith.loyalty.journal.core.data.campaign.data_model"
  flat_package: true
  single_file: true
  java_conversions: false
  import: "infrastructure.journal.*"
  lenses: true
  getters: true
  retain_source_code_info: false
  no_default_values_in_constructor: false
  preserve_unknown_fields: false
  enum_value_naming: CAMEL_CASE
  enum_strip_prefix: false
  scala3_sources: true
};

message Budget {
  option (scalapb.message).extends = "JournalSerializable";
  com.zenith.loyalty.journal.core.data.common.data_model.Amount totalBudget = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  com.zenith.loyalty.journal.core.data.common.data_model.Amount totalSpent = 2;
}

message Duration {
  option (scalapb.message).extends = "JournalSerializable";
  google.protobuf.Timestamp startDate = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  google.protobuf.Timestamp endDate = 2 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
}

message StatusOptional {
  option (scalapb.message).extends = "JournalSerializable";

  Status value = 1;
}

enum Status {
  DRAFT = 0;
  PENDING_APPROVAL = 1;
  APPROVAL = 2;
  ACTIVE = 3;
  INACTIVE = 4;
  CLOSED = 5;
  CANCELLED = 6;
}
