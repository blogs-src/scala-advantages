syntax = "proto3";

package com.zenith.loyalty.journal.core.data.reward.data_model;

import "com/zenith/loyalty/journal/core/data/common/data_model.proto";
import "google/protobuf/wrappers.proto";
import "scalapb/scalapb.proto";

option (scalapb.options) = {
  scope: FILE
  package_name: "com.zenith.loyalty.journal.core.data.reward.data_model"
  flat_package: true
  single_file: true
  java_conversions: false
  import: "infrastructure.journal.*"
  lenses: true
  getters: true
  retain_source_code_info: false
  no_default_values_in_constructor: false
  preserve_unknown_fields: false
  enum_value_naming: CAMEL_CASE
  enum_strip_prefix: false
  scala3_sources: true
};

message Reward {
  option (scalapb.message).extends = "JournalSerializable";

  google.protobuf.StringValue id = 1 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
  com.zenith.loyalty.journal.core.data.common.data_model.Amount amount = 2 [
    (scalapb.field).no_box = true,
    (scalapb.field).required = true
  ];
}
